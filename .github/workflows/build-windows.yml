name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.x
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        shell: pwsh
        run: |
          flutter pub get 2>&1 | Tee-Object -FilePath pub.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content pub.log | Select-Object -Last 40 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - name: Analyze (errors only)
        shell: pwsh
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | Tee-Object -FilePath analyze.log
          Get-Content analyze.log | Where-Object { $_ -match '^\s*error' } | Select-Object -First 40 | ForEach-Object { Write-Output "::error::$_" }

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | Where-Object { $_ -match 'error|Error|failed' } | Select-Object -First 45 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - name: Deploy MSVC runtime
        shell: pwsh
        run: ./packaging/windows/collect_vc_runtime.ps1 -ReleaseDir build/windows/x64/runner/Release

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)' | Select-Object -First 1
          $v = $line.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" packaging/windows/diubang_nasclient.iss

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath DiuBangNASClient-portable-${{ steps.ver.outputs.version }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiuBangNASClient-Windows-${{ steps.ver.outputs.version }}
          path: |
            packaging/windows/output/*.exe
            DiuBangNASClient-portable-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/windows/output/*.exe
            DiuBangNASClient-portable-*.zip
